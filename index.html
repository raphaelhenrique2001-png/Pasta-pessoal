<!DOCTYPE html>
<!--A VERSÃO DO HTML (NOVA 5) -->

<!-- DENTRO DA TAG HTML FICA TODO O MEU SISTEMA WEB (SITE)-->
<html lang="pt-br">

<!-- CABEÇA (HEAD) CONFIGURAÇÕES GERAIS DO SITE-->

<head>
  <!-- Padrão Caracteres -->
  <meta charset="UTF-8">
  <!-- COMPATIVEL COM CELULARES E COMPUTADORES -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <!-- TITULO DO SITE-->
  <title>Document</title>
</head>
<!--TUDO QUE EU EXERGO NO SITE-->

<body>
  <p class="nome">Lucia</p>

  <img class="personagem" src="img/lucia.png">
  <!--source = ORIGEM( onde ela tá?)-->

  <div class="textos">

    <p class="etiqueta">Selecione o seu Personagem</p>
    <h1>Não é só <br>um Jogo.</h1>
    <p class="texto_apoio">Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma.</p>

  </div>

 <!-- onclick - O que deve ACONTECER QUANDO EU CLICO -->
  <div class="menu">

    <img onclick="escolherPersonagem('Lucia', 'img/lucia.png', '#ff3cac')" class="avatar" src="img/lucia.png">

    <img onclick="escolherPersonagem('Jason', 'img/jason.png', '#00b2c9')" class="avatar" src="img/jason.png">

    <img onclick="escolherPersonagem('CJ', 'img/cj.png', '#7ed37e')" class="avatar" src="img/cj.png">

    <label class="voce">📸

      <!-- file(arquivos) accept (aceita)
        image/todas
        hidden (escondido)
        this (isso aqui) - tudo que tem no input e enviar
        -->

      <input type="file" accept="image/*" hidden onchange="lerFoto(this)"> 
    </label>

  </div>

</body>
<script src=" https://js.puter.com/v2/ "></script>
<script src="scripts.js">


</script>

</html>
